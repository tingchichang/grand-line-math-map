<style>
/* Layout: two seas (grade 7 and grade 8) of topic islands; each island opens a three-part voyage (lesson → practice → real exam items). */
:root{
  --paper:#f2e4c4; --paper2:#e8d3a6; --card:#fbf3df; --ink:#2a1a0f; --ink2:#5b4630; --red:#b8231a; --gold:#c98a12;
  --sea:#17405e; --sea2:#2a6a8f; --wave:#b9d7e6; --wave2:#cfe3d5; --line:#c9ae7c; --good:#2f7a3d; --bad:#b8231a; --shadow:rgba(60,35,10,.2);
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-pirate:"Pirata One","Noto Serif TC",serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --imgbg:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0e1a26;--paper2:#13263a;--card:#182c40;--ink:#f1e5c8;--ink2:#c9b48c;--red:#ff6b57;--gold:#f2bf4a;--sea:#7fc2e8;--sea2:#9fd3f0;--wave:#1d3a55;--wave2:#1c3d3a;--line:#33506b;--good:#6fcf7f;--bad:#ff6b57;--shadow:rgba(0,0,0,.45);--imgbg:#f4ecd8;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1a26;--paper2:#13263a;--card:#182c40;--ink:#f1e5c8;--ink2:#c9b48c;--red:#ff6b57;--gold:#f2bf4a;--sea:#7fc2e8;--sea2:#9fd3f0;--wave:#1d3a55;--wave2:#1c3d3a;--line:#33506b;--good:#6fcf7f;--bad:#ff6b57;--shadow:rgba(0,0,0,.45);--imgbg:#f4ecd8;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--sea2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px 10px;border-bottom:3px double var(--line)}
.brand .e{font-family:var(--f-pirate);color:var(--red);font-size:18px;letter-spacing:.06em}
.brand h1{font-size:clamp(24px,4.5vw,36px);font-weight:900}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:2px solid var(--ink);border-radius:999px;padding:3px 12px;background:var(--card);font-weight:700;font-size:14px;white-space:nowrap}
.chip b{font-family:var(--f-mono);color:var(--red)}
.btn{border:2px solid var(--ink);background:var(--card);padding:8px 16px;border-radius:8px;font-weight:700;box-shadow:3px 3px 0 var(--ink);text-decoration:none;display:inline-block}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff8ea;box-shadow:3px 3px 0 var(--ink)}
.btn.sm{padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
main{padding-top:18px}
.lead{color:var(--ink2);max-width:72ch}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebox input{font:inherit;padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink)}
.sea{margin-top:18px}
.sea h2{font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sea h2 small{font-family:var(--f-body);font-size:13px;color:var(--ink2);font-weight:500}
.mapbox{border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--shadow);overflow:hidden;margin-top:8px}
.mapbox svg{display:block;width:100%;height:auto}
.isl{cursor:pointer}
.isl:focus{outline:none}
.isl:focus-visible .ring,.isl:hover .ring{stroke:var(--gold);stroke-width:5}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.icard{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;text-align:left;box-shadow:4px 4px 0 var(--shadow);display:grid;gap:2px;min-width:0;text-decoration:none;color:var(--ink)}
.icard .n{font-family:var(--f-mono);color:var(--red);font-size:13px;font-weight:600}
.icard h3{font-size:17px}
.icard .m{font-size:13px;color:var(--ink2)}
.stars{color:var(--gold);letter-spacing:2px;font-size:17px}
.stage{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:18px;box-shadow:6px 6px 0 var(--shadow);margin-top:12px}
.stagehd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:14px}
.hearts{font-size:20px;letter-spacing:2px;color:var(--red)}
.prog{display:flex;gap:4px}
.prog i{width:18px;height:8px;border-radius:4px;background:var(--line)}
.prog i.ok{background:var(--good)}.prog i.no{background:var(--bad)}.prog i.cur{background:var(--gold)}
.phase{font-size:13px;font-weight:700;color:var(--sea);letter-spacing:.08em}
.q{font-size:19px;margin:6px 0 12px}
.q .katex{font-size:1.08em}
table.tb{border-collapse:collapse;margin:8px 0;font-family:var(--f-mono);font-size:17px}
table.tb th,table.tb td{border:1px solid var(--line);padding:4px 14px;text-align:center}
table.tb th{background:var(--paper2)}
.qimg{background:var(--imgbg);border:1px solid var(--line);padding:6px;border-radius:6px;margin:8px 0}
.qimg img{display:block;width:100%;height:auto}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.lab4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.opts{grid-template-columns:1fr}.opts.lab4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{border:2px solid var(--ink);background:var(--paper);padding:10px 12px;border-radius:8px;text-align:left;font-size:17px;min-height:48px;overflow-x:auto}
.opt:hover{background:var(--paper2)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .lab{font-weight:700;margin-right:6px}
.fb{margin-top:14px;border-left:5px solid var(--good);background:var(--paper);padding:10px 14px;border-radius:4px}
.fb.no{border-left-color:var(--bad)}
.fb b{font-family:var(--f-display)}
.rates{display:grid;gap:4px;margin-top:8px}
.rate{display:grid;grid-template-columns:40px 1fr 56px;gap:8px;align-items:center;font-size:13px;font-family:var(--f-mono)}
.rate .t{height:12px;background:var(--paper2);border-radius:6px;position:relative;overflow:hidden}
.rate .t i{position:absolute;inset:0 auto 0 0;background:var(--sea2)}
.rate.a .t i{background:var(--good)}.rate.me .t i{background:var(--red)}
.lesson{display:grid;gap:10px;margin:8px 0 14px;padding:0;list-style:none;counter-reset:l}
.lesson li{counter-increment:l;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.lesson li::before{content:counter(l);font-family:var(--f-pirate);font-size:22px;background:var(--red);color:#fff8ea;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.core{background:var(--paper);border-left:6px solid var(--sea);padding:8px 14px;border-radius:6px}
.src{font-size:12px;color:var(--ink2)}
.poster{max-width:440px;margin:12px auto;background:#efdcae;color:#3a2412;border:6px double #6b4a26;padding:18px;text-align:center;box-shadow:8px 8px 0 var(--shadow)}
.poster .w{font-family:var(--f-pirate);font-size:64px;line-height:1;letter-spacing:.06em}
.poster .nm{font-family:var(--f-display);font-size:30px;margin:6px 0}
.poster .bounty{font-family:var(--f-mono);font-size:30px;font-weight:600}
.poster .badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.poster .badges span{border:2px solid #6b4a26;border-radius:999px;padding:0 10px;font-size:13px;font-weight:700}
.poster .face{width:120px;height:120px;margin:8px auto;border:4px solid #6b4a26;background:#f7ebc8;display:grid;place-items:center;font-family:var(--f-display);font-size:48px}
.foot{margin-top:28px;font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}}
</style>

/* 寶藏主題闖關群島：各主題的練習題產生器。
   每個產生器回傳 {q, opts, ans, why, explain}；字串中 $…$ 之間是 KaTeX 語法。
   錯誤選項都由該主題「迷思解藥」列出的迷思推得，why 說明那個選項錯在哪裡。 */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v=0;while(!v)v=rnd(a,b);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const P=n=>n<0?`(${n})`:String(n);
/* TeX：多項式各項 [[係數,'x^2'],[係數,'x'],[常數,'']] */
function poly(ts){let s='';ts.forEach(([c,v])=>{if(!c)return;const a=Math.abs(c);s+=(c<0?'-':s?'+':'')+(v?(a===1?'':a)+v:a)});return s||'0'}
const fx=v=>v?`(x${v>0?'+':'-'}${Math.abs(v)})`:'x';
const dec=v=>{const r=Math.round(v*1e6)/1e6;return String(r)};
const frT=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?String(n):`${n<0?'-':''}\\frac{${Math.abs(n)}}{${d}}`};
/* 組題：正解＋錯誤選項（去除重複），不足 4 個時用 fill 補 */
function mcU(q,correct,wrongs,explain,fill){const seen=new Set([correct]),opts=[correct],why={};
  for(const [t,w] of wrongs){if(opts.length>=4)break;if(!seen.has(t)){seen.add(t);why[opts.length]=w;opts.push(t)}}
  /* 錯誤選項撞在一起時：沒有指定 fill，就把正解裡的某一個整數改掉（一定是錯的） */
  const auto=()=>{const m=[...correct.matchAll(/\d+/g)];if(!m.length)return [correct,''];const x=pick(m),v=Math.max(0,+x[0]+nz(-3,3));return [correct.slice(0,x.index)+v+correct.slice(x.index+x[0].length),'把這個答案代回題目檢查，就會發現不對。']};
  let guard=0;while(opts.length<4&&guard++<80){const [t,w]=(fill&&guard<40?fill:auto)();if(!seen.has(t)){seen.add(t);why[opts.length]=w;opts.push(t)}}
  const ord=shuffle(opts.map((_,i)=>i));return {kind:'mc',q,opts:ord.map(i=>opts[i]),ans:ord.indexOf(0),why:Object.fromEntries(Object.entries(why).map(([k,v])=>[ord.indexOf(+k),v])),explain}}
const num=(v,w)=>[`$${v}$`,w];

     <circle class="ring" r="56" fill="none" stroke="transparent"/><text y="-2" text-anchor="middle" font-size="12" font-weight="700" font-family="IBM Plex Mono,monospace" fill="#1f2a12">${d.id}</text>

   <p class="src">${sid()?`已登船：${esc(S.cls)} 班 ${esc(S.seat)} 號 ${esc(S.name)}。`:'請先輸入班級、座號與姓名再出航。'}${API?'你的作答會自動傳給老師，也可以在「我的航海日誌」回顧。':'目前沒有連上老師的紀錄表，作答只會存在這台裝置。'}</p>
   ${[7,8].map(g=>`<section class="sea"><h2>${g===7?'七年級海域':'八年級海域'}<small>${ISL.filter(d=>d.grade===g&&cleared(d.id)).length}／${ISL.filter(d=>d.grade===g).length} 座島已通關</small></h2>${seaMap(g)}
    <div class="cards">${ISL.filter(d=>d.grade===g).map(d=>{const st=cleared(d.id)?S.isl[d.id].stars:0;return `<button class="icard" data-i="${d.id}"><span class="n">${d.id}</span><h3>${esc(d.name)}</h3><span class="m">陷阱：${esc(d.mis[0])}</span><span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span></button>`}).join('')}
     ${g===7?`<a class="icard" href="../equation-game/"><span class="n">A-7-2、A-7-3</span><h3>一元一次方程式</h3><span class="m">另一片海域：七座島、天平與 BUCK 讀題</span><span class="m" style="color:var(--sea2);font-weight:700">前往一元一次方程式闖關島 ↗</span></a>`:''}</div></section>`).join('')}
   <p style="margin-top:16px"><button class="btn sm" id="reset">清除進度</button></p>`;
  app.querySelectorAll('[data-i]').forEach(el=>{const go=()=>{if(!sid()){toast('請先輸入班級和座號，按「登船」');$('#cls').focus();return}openIsland(el.dataset.i)};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  $('#nmSave').onclick=()=>{const c=$('#cls').value.trim().replace(/\D/g,''),s=$('#seat').value.trim().replace(/\D/g,'');
    if(!c||!s){toast('班級和座號都要填數字');return}S.cls=c;S.seat=String(+s);S.name=$('#nm').value.trim();save();toast(`歡迎登船，${S.name||'船長'}！`);viewMap()};
  $('#poster').onclick=viewPoster;
  let armed=false;$('#reset').onclick=e=>{if(!armed){armed=true;e.target.textContent='再按一次確認清除';setTimeout(()=>{armed=false;if(e.target.isConnected)e.target.textContent='清除進度'},3000);return}S={...S,bounty:0,isl:{},hist:[]};save();viewMap()};
}

/* ---------- 島嶼流程 ---------- */
let R=null;
function realQ(id){const r=REAL[id];return {kind:'mc',real:id,q:'',img:r.img,opts:r.lab.map(()=> ''),lab:r.lab,ans:r.ans,alt:r.alt||[],why:r.why,rates:r.rates,src:r.src,explain:''}}
function openIsland(id){const d=byId(id),gens=GEN[id];
  const order=shuffle([...gens,...gens,...gens]).slice(0,5);const practice=order.map(g=>g());
  const reals=shuffle(d.real).slice(0,Math.min(2,d.real.length)).map(realQ);
  R={d,qs:[...practice,...reals],i:0,hearts:3,miss:0,res:[],nPractice:practice.length,gain:0,round:Date.now().toString(36)};viewLesson()}
function stageHead(phase){const d=R.d;return `<div class="stagehd"><div><div class="phase">${phase}</div><h2>${d.id===REVIEW?'REVIEW':esc(d.id)}｜${esc(d.name)}</h2></div>
  <div style="display:grid;gap:4px;justify-items:end"><span class="hearts" aria-label="剩下 ${R.hearts} 顆心">${'♥'.repeat(Math.max(R.hearts,0))}${'♡'.repeat(3-Math.max(R.hearts,0))}</span>
  <span class="prog">${R.qs.map((q,i)=>`<i class="${R.res[i]===true?'ok':R.res[i]===false?'no':i===R.i?'cur':''}"></i>`).join('')}</span></div></div>`}
function viewLesson(){const d=R.d;
  app.innerHTML=`<section class="stage pop">${stageHead('第一關・航海士小教室')}
   ${d.core?`<p class="core"><b>核心概念：</b>${esc(d.core)}</p>`:''}
   <h3 style="margin-top:12px">這座島的陷阱</h3><ol class="lesson">${d.mis.map(t=>`<li><span>${esc(t)}</span></li>`).join('')}</ol>
   ${d.ask&&d.ask.length?`<p><b>出航前想一想：</b>${d.ask.map(esc).join('　')}</p>`:''}
   ${d.id!==REVIEW?`<p class="src">想先動手操作？到 <a href="../topic-lab/#${esc(d.id)}" target="_blank" rel="noopener">主題探究實驗室 ${esc(d.id)}</a> 拉滑桿看看。</p>`:''}
   <p style="margin-top:12px">接下來有 ${R.nPractice?`${R.nPractice} 題練習、`:''}${R.qs.length-R.nPractice} 題真題。答錯會扣一顆心，三顆心都用完就要重新出航。</p>
   <p><button class="btn pri" id="start">出航！</button></p></section>`;
  $('#start').onclick=nextQ}
function nextQ(){if(R.i>=R.qs.length)return finish();const q=R.qs[R.i];R.qStart=Date.now();
  showMC(q,R.i<R.nPractice?`第二關・練習 ${R.i+1}／${R.nPractice}`:`第三關・真題挑戰 ${R.i-R.nPractice+1}／${R.qs.length-R.nPractice}`)}
function record(ok,pts){R.res[R.i]=ok;if(ok)R.gain+=pts;else{R.hearts--;R.miss++}
  const h=document.querySelector('.hearts');if(h){h.textContent='♥'.repeat(Math.max(R.hearts,0))+'♡'.repeat(3-Math.max(R.hearts,0));h.setAttribute('aria-label',`剩下 ${Math.max(R.hearts,0)} 顆心`)}
  const p=document.querySelectorAll('.prog i')[R.i];if(p)p.className=ok?'ok':'no'}
function afterAnswer(box){const b=document.createElement('p');b.style.marginTop='12px';
  if(R.hearts<=0&&R.d.id!==REVIEW){b.innerHTML='<b style="color:var(--bad)">三顆心都用完了，船要回港整修。</b> <button class="btn pri" id="retry">重新挑戰</button> <button class="btn" id="home2">回海圖</button>';box.appendChild(b);$('#retry').onclick=()=>openIsland(R.d.id);$('#home2').onclick=viewMap;return}
  b.innerHTML=`<button class="btn pri" id="nx">${R.i+1>=R.qs.length?'看結果':'下一題'}</button>`;box.appendChild(b);$('#nx').onclick=()=>{R.i++;nextQ()};$('#nx').focus()}
function showMC(q,phase){const lab=q.lab||['(A)','(B)','(C)','(D)'];
  app.innerHTML=`<section class="stage">${stageHead(phase)}
   ${q.src?`<p class="src">${esc(q.src)}${q.real?'｜看圖作答，選出正確的選項':''}</p>`:''}${q.q?`<div class="q">${fmt(q.q)}</div>`:''}${q.img&&IMG[q.img]?`<div class="qimg"><img alt="題目" src="data:image/png;base64,${IMG[q.img]}"></div>`:''}
   <div class="opts ${q.real?'lab4':''}">${q.opts.map((o,i)=>`<button class="opt" data-k="${i}"><span class="lab">${lab[i]}</span>${fmt(o)}</button>`).join('')}</div><div id="fbx"></div></section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,okSet=[q.ans,...(q.alt||[])];app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(okSet.includes(+x.dataset.k))x.classList.add('ok')});
    const ok=okSet.includes(k);if(!ok)b.classList.add('no');
    logAns({qid:q.real||('gen-'+R.d.id),q:q.real?REAL[q.real].src:plain(q.q),ans:`${lab[k]} ${plain(q.opts[k])}`.trim(),correct:`${lab[q.ans]} ${plain(q.opts[q.ans])}`.trim(),ok,hint:ok?'':plain(q.why[k]||'')});
    record(ok,q.real?300:100);
    const rates=q.rates?`<div class="rates"><div class="src">全國作答比例${q.real.startsWith('C')?'（會考全體考生）':'（學習扶助篩選測驗受測學生）'}</div>${q.rates.map((v,i)=>`<div class="rate ${okSet.includes(i)?'a':i===k&&!ok?'me':''}"><span>${lab[i]}</span><span class="t"><i style="width:${v*100}%"></i></span><span>${+(v*100).toFixed(2)}%</span></div>`).join('')}</div>`:'';
    const same=q.rates&&!ok?`<p>全國有 <b>${+(q.rates[k]*100).toFixed(2)}%</b> 的同學和你選一樣，你不孤單！</p>`:'';
    const fb=$('#fbx');fb.innerHTML=`<div class="fb ${ok?'':'no'} pop"><b>${ok?'答對了！':'差一點！'}</b>${ok?` 賞金 +${q.real?300:100}`:''}
     ${!ok&&q.why[k]?`<p>${fmt(q.why[k])}</p>`:''}${same}${q.explain?`<p>${fmt(q.explain)}</p>`:''}${rates}${q.real&&!ok?`<p class="src">想不通？回到小教室看看這座島的陷阱，或到<a href="../topic-lab/#${esc(R.d.id===REVIEW?REAL[q.real].topic:R.d.id)}" target="_blank" rel="noopener">主題探究實驗室</a>動手操作。</p>`:''}</div>`;afterAnswer(fb.firstElementChild)})}

/* ---------- 結算與懸賞令 ---------- */
function finish(){const d=R.d;
  if(d.id===REVIEW){S.bounty+=R.gain;save();const n=R.res.filter(Boolean).length;
    app.innerHTML=`<section class="stage pop">${stageHead('訂正結算')}<h2>訂正了 ${n}／${R.qs.length} 題</h2><p>賞金 +${R.gain}。${n<R.qs.length?'還沒訂正的題目會留在錯題本，下次再挑戰。':'全部訂正完成！'}</p>
     <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="lg">回我的航海日誌</button><button class="btn" id="hm4">回海圖</button></p></section>`;
    $('#lg').onclick=viewLog;$('#hm4').onclick=viewMap;return}
  const ok=R.hearts>0;let stars=0;
  if(ok){stars=R.miss===0?3:R.miss===1?2:1;const prev=S.isl[d.id]?.stars||0;if(stars>prev)S.isl[d.id]={stars};S.bounty+=R.gain+500;save()}
  const sameSea=ISL.filter(x=>x.grade===d.grade&&!cleared(x.id)&&x.id!==d.id);
  app.innerHTML=`<section class="stage pop">${stageHead('航海結算')}
   ${ok?`<h2 style="color:var(--good)">${esc(d.name)}通關！</h2><p class="stars" style="font-size:34px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
    <p>本次賞金 <b>${(R.gain+500).toLocaleString()}</b> 貝里（含通關獎勵 500）。答錯 ${R.miss} 題。</p>`
    :`<h2 style="color:var(--bad)">這次沒有通關</h2><p>回到小教室複習一下這座島的陷阱，再出航吧！</p>`}
   <p class="src">這座島的陷阱：${d.mis.map(esc).join('／')}</p>
   <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="again">${ok?'再玩一次（題目會換）':'重新挑戰'}</button>${ok&&sameSea.length?`<button class="btn" id="nexti">前往 ${esc(sameSea[0].name)}</button>`:''}<button class="btn" id="home3">回海圖</button>${ok?'<button class="btn" id="pst">看我的懸賞令</button>':''}</p></section>`;
  $('#again').onclick=()=>openIsland(d.id);$('#home3').onclick=viewMap;if($('#nexti'))$('#nexti').onclick=()=>openIsland(sameSea[0].id);if($('#pst'))$('#pst').onclick=viewPoster}
function viewPoster(){const badges=ISL.filter(d=>cleared(d.id)).map(d=>`<span>${esc(d.short)}${'★'.repeat(S.isl[d.id].stars)}</span>`).join('');
  app.innerHTML=`<div class="poster pop"><div class="w">WANTED</div><div class="face">${esc((S.name||'?').slice(0,1))}</div><div class="nm">${esc(S.name||'無名船長')}</div><div>DEAD OR ALIVE</div>
   <div class="bounty">฿ ${S.bounty.toLocaleString()} –</div><div style="margin-top:6px">寶藏主題群島 通關 ${ISL.filter(d=>cleared(d.id)).length}／${ISL.length} 島</div><div class="badges">${badges}</div></div>
   <p style="text-align:center"><button class="btn" id="hm">回海圖</button></p><p class="src" style="text-align:center">可以截圖交給老師，當作闖關紀錄。</p>`;
  $('#hm').onclick=viewMap}

/* ---------- 我的航海日誌（學生回顧） ---------- */
function viewLog(){const me=sid();const H=S.hist.filter(r=>(r.ok===true||r.ok===false)&&r.sid===me);
  const tot=H.length,ok=H.filter(r=>r.ok).length;
  const byI=ISL.map(d=>{const a=H.filter(r=>r.isl===d.id);return {d,n:a.length,ok:a.filter(r=>r.ok).length}}).filter(x=>x.n);
  const wrong=H.filter(r=>!r.ok).slice().reverse();
  const lastOk=id=>{const a=H.filter(r=>r.qid===id);return a.length&&a[a.length-1].ok};
  const pending=[...new Set(wrong.filter(r=>REAL[r.qid]).map(r=>r.qid))].filter(id=>!lastOk(id));
  const weak=byI.filter(x=>x.n>=3&&x.ok/x.n<.7).sort((a,b)=>a.ok/a.n-b.ok/b.n);
  app.innerHTML=`<section class="stage pop"><div class="stagehd"><div><div class="phase">MY LOGBOOK</div><h2>我的航海日誌</h2></div><span class="chip">${sid()?`${esc(S.cls)} 班 ${esc(S.seat)} 號 ${esc(S.name)}`:'尚未登船'}</span></div>
   ${tot?`<p>一共作答 <b>${tot}</b> 題，答對 <b>${ok}</b> 題（${Math.round(ok/tot*100)}%）。${S.outbox.length?`還有 ${S.outbox.length} 筆紀錄等網路連上後上傳。`:''}</p>
   <h3 style="margin-top:12px">各島答對率</h3><div class="rates" style="max-width:640px">${byI.map(x=>`<div class="rate" style="grid-template-columns:minmax(120px,220px) 1fr 70px"><span style="font-family:var(--f-body)">${esc(x.d.short)}</span><span class="t"><i style="width:${x.ok/x.n*100}%;background:${x.ok/x.n>=.8?'var(--good)':x.ok/x.n>=.6?'var(--gold)':'var(--bad)'}"></i></span><span>${x.ok}/${x.n}</span></div>`).join('')}</div>
   ${weak.length?`<div class="fb no" style="margin-top:12px"><b>建議再練習：</b>${weak.map(x=>`<button class="btn sm" data-go="${esc(x.d.id)}">${esc(x.d.short)}</button>`).join(' ')}</div>`:''}
   <h3 style="margin-top:16px">錯題本（${wrong.length} 題）</h3>
   ${pending.length?`<p><button class="btn pri" id="redo">錯題再挑戰（${pending.length} 題真題）</button> <span class="src">還沒訂正成功的真題會再出一次。</span></p>`:wrong.length?'<p class="src">真題錯題都已經訂正了！練習題答錯的，可以回到該島再玩一次。</p>':''}
   <div style="display:grid;gap:10px;margin-top:8px">${wrong.slice(0,60).map(r=>`<div class="fb no" style="margin:0"><div class="src">${new Date(r.t).toLocaleString('zh-TW',{hour12:false})}｜${esc(r.islName)}｜${esc(r.phase)}</div>
     <div><b>${esc(r.q)}</b></div><div>我的答案：${esc(r.ans)}　正確答案：${esc(r.correct)}</div>${r.hint?`<div>提示：${esc(r.hint)}</div>`:''}${REAL[r.qid]?(lastOk(r.qid)?'<div style="color:var(--good)">✔ 已訂正</div>':''):''}</div>`).join('')||'<p>目前沒有錯題，太厲害了！</p>'}</div>`
   :'<p>還沒有作答紀錄。回到海圖出航吧！</p>'}
   <p style="margin-top:14px"><button class="btn" id="hm">回海圖</button></p></section>`;
  $('#hm').onclick=viewMap;app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openIsland(b.dataset.go));
  if($('#redo'))$('#redo').onclick=()=>openReview(pending.slice(0,10))}
function openReview(ids){R={d:{id:REVIEW,name:'錯題島',short:'錯題島',myth:'錯題再挑戰',mis:['先讀一次上次的提示，再作答。','答對就算訂正成功，答錯會再顯示全國作答比例與提示。'],grade:0},
  qs:shuffle(ids).map(realQ),i:0,hearts:3,miss:0,res:[],nPractice:0,gain:0,round:Date.now().toString(36)};viewLesson()}

$('#goLog').onclick=viewLog;$('#goHome').onclick=viewMap;hud();viewMap();flush();
/* 從航海圖或實驗室連過來（#主題代碼）：已登船就直接出航 */
const deep=decodeURIComponent(location.hash.slice(1));
if(byId(deep)){if(sid())openIsland(deep);else{toast('先輸入班級、座號並登船，再出航');$('#cls').focus()}}
window.addEventListener('load',()=>{if(!R)viewMap()});
</script>

</html>
