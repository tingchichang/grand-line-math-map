<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>一元一次方程式闖關島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=Pirata+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a sea chart hub with seven islands; each island opens a three-part voyage (lesson → practice → real exam questions). */
:root{
  --paper:#f2e4c4; --paper2:#e8d3a6; --card:#fbf3df; --ink:#2a1a0f; --ink2:#5b4630; --red:#b8231a; --gold:#c98a12;
  --sea:#17405e; --sea2:#2a6a8f; --wave:#b9d7e6; --line:#c9ae7c; --good:#2f7a3d; --bad:#b8231a; --shadow:rgba(60,35,10,.2);
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-pirate:"Pirata One","Noto Serif TC",serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --imgbg:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0e1a26;--paper2:#13263a;--card:#182c40;--ink:#f1e5c8;--ink2:#c9b48c;--red:#ff6b57;--gold:#f2bf4a;--sea:#7fc2e8;--sea2:#9fd3f0;--wave:#1d3a55;--line:#33506b;--good:#6fcf7f;--bad:#ff6b57;--shadow:rgba(0,0,0,.45);--imgbg:#f4ecd8;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1a26;--paper2:#13263a;--card:#182c40;--ink:#f1e5c8;--ink2:#c9b48c;--red:#ff6b57;--gold:#f2bf4a;--sea:#7fc2e8;--sea2:#9fd3f0;--wave:#1d3a55;--line:#33506b;--good:#6fcf7f;--bad:#ff6b57;--shadow:rgba(0,0,0,.45);--imgbg:#f4ecd8;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px 10px;border-bottom:3px double var(--line)}
.brand .e{font-family:var(--f-pirate);color:var(--red);font-size:18px;letter-spacing:.06em}
.brand h1{font-size:clamp(24px,4.5vw,36px);font-weight:900}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:2px solid var(--ink);border-radius:999px;padding:3px 12px;background:var(--card);font-weight:700;font-size:14px;white-space:nowrap}
.chip b{font-family:var(--f-mono);color:var(--red)}
.btn{border:2px solid var(--ink);background:var(--card);padding:8px 16px;border-radius:8px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff8ea;box-shadow:3px 3px 0 var(--ink)}
.btn.sm{padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
main{padding-top:18px}
.lead{color:var(--ink2);max-width:68ch}
/* map */
.mapbox{background:var(--wave);border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--shadow);overflow:hidden;margin-top:12px}
.mapbox svg{display:block;width:100%;height:auto}
.isl{cursor:pointer}
.isl:focus{outline:none}
.isl:focus-visible .ring,.isl:hover .ring{stroke:var(--gold);stroke-width:5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.icard{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:12px;text-align:left;box-shadow:4px 4px 0 var(--shadow);display:grid;gap:4px;min-width:0}
.icard .n{font-family:var(--f-pirate);color:var(--red);font-size:20px;line-height:1}
.icard h3{font-size:19px}
.icard .m{font-size:13px;color:var(--ink2)}
.stars{color:var(--gold);letter-spacing:2px;font-size:18px}
.lock{font-size:13px;color:var(--ink2)}
/* stage */
.stage{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:18px;box-shadow:6px 6px 0 var(--shadow);margin-top:12px}
.stagehd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:14px}
.hearts{font-size:20px;letter-spacing:2px;color:var(--red)}
.prog{display:flex;gap:4px}
.prog i{width:18px;height:8px;border-radius:4px;background:var(--line)}
.prog i.ok{background:var(--good)}.prog i.no{background:var(--bad)}.prog i.cur{background:var(--gold)}
.phase{font-size:13px;font-weight:700;color:var(--sea);letter-spacing:.08em}
.q{font-size:20px;margin:6px 0 12px}
.q .eq{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.qimg{background:var(--imgbg);border:1px solid var(--line);padding:6px;border-radius:6px;margin:8px 0}
.qimg img{display:block;width:100%;height:auto}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--ink);background:var(--paper);padding:10px 12px;border-radius:8px;text-align:left;font-family:var(--f-mono);font-size:17px;min-height:48px}
.opt:hover{background:var(--paper2)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .lab{font-family:var(--f-body);font-weight:700;margin-right:6px}
.fb{margin-top:14px;border-left:5px solid var(--good);background:var(--paper);padding:10px 14px;border-radius:4px}
.fb.no{border-left-color:var(--bad)}
.fb b{font-family:var(--f-display)}
.rates{display:grid;gap:4px;margin-top:8px}
.rate{display:grid;grid-template-columns:40px 1fr 48px;gap:8px;align-items:center;font-size:13px;font-family:var(--f-mono)}
.rate .t{height:12px;background:var(--paper2);border-radius:6px;position:relative;overflow:hidden}
.rate .t i{position:absolute;inset:0 auto 0 0;background:var(--sea2)}
.rate.a .t i{background:var(--good)}.rate.me .t i{background:var(--red)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{font:inherit;font-family:var(--f-mono);font-size:20px;width:9em;padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink)}
.lesson{display:grid;gap:10px;margin:8px 0 14px;padding:0;list-style:none;counter-reset:l}
.lesson li{counter-increment:l;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.lesson li::before{content:counter(l);font-family:var(--f-pirate);font-size:22px;background:var(--sea);color:#fff8ea;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.src{font-size:12px;color:var(--ink2)}
/* balance */
.bal{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px}
.bal svg{display:block;width:100%;height:auto;max-height:240px}
.baleq{font-family:var(--f-mono);font-size:26px;font-weight:600;text-align:center;margin:6px 0}
.ops{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:8px}
.ops select,.ops input{font:inherit;font-size:17px;padding:6px 8px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink)}
.ops input{width:5em;font-family:var(--f-mono)}
.log{font-family:var(--f-mono);font-size:14px;margin:8px 0 0;padding-left:20px;color:var(--ink2)}
.warn{color:var(--bad);font-weight:700;text-align:center;min-height:1.6em}
/* BUCK */
.bkmodes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.bkmodes button{border:2px solid var(--ink);background:var(--card);padding:4px 12px;border-radius:999px;font-weight:700}
.bkmodes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bktext{font-size:18px;line-height:2.2;background:var(--paper);border:1px solid var(--line);padding:12px 14px;border-radius:8px}
.seg{cursor:pointer;border-radius:3px;padding:1px 2px;background:rgba(201,138,18,.12)}
.seg:hover{background:rgba(201,138,18,.3)}
.seg.b{outline:2.5px solid var(--red);outline-offset:2px;background:none}
.seg.u{text-decoration:underline;text-decoration-color:var(--sea2);text-decoration-thickness:3px;text-underline-offset:5px;background:none}
.seg.c{border:2px solid var(--gold);border-radius:999px;padding:0 5px;background:none}
.seg.k{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink2);background:none}
.seg.wrong{box-shadow:0 0 0 2px var(--bad) inset}
/* poster */
.poster{max-width:420px;margin:12px auto;background:#efdcae;color:#3a2412;border:6px double #6b4a26;padding:18px;text-align:center;box-shadow:8px 8px 0 var(--shadow)}
.poster .w{font-family:var(--f-pirate);font-size:64px;line-height:1;letter-spacing:.06em}
.poster .nm{font-family:var(--f-display);font-size:30px;margin:6px 0}
.poster .bounty{font-family:var(--f-mono);font-size:30px;font-weight:600}
.poster .badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.poster .badges span{border:2px solid #6b4a26;border-radius:999px;padding:0 10px;font-size:13px;font-weight:700}
.poster .face{width:120px;height:120px;margin:8px auto;border:4px solid #6b4a26;background:#f7ebc8;display:grid;place-items:center;font-family:var(--f-display);font-size:48px}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebox input{font:inherit;padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);width:12em}
.foot{margin-top:28px;font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
 #beam{transition:transform .4s ease}}
</style>

  <div class="foot">題目來源：國中教育會考（111、114、115 年）與學習扶助篩選測驗考古題（109–114 年）；全國作答比例取自心測中心試題分析與全國篩選測驗各題作答比例。練習題由程式依題型隨機產生。搭配教師版網頁<a href="https://tingchichang.github.io/grand-line-math-map/" target="_blank" rel="noopener">《偉大航道學力航海圖》</a>使用。進度只存在這台裝置的瀏覽器中。</div>

<script>
const REAL={"S113-7-7":{"src":"113 年 5 月七年級篩選測驗第 7 題","img":"scr113_7_07.png","lc":"A-7-2","opts":["x + 39 = 99","5x + 39 = 99","5(x + 39) = 99","5 + x + 39 = 99"],"ans":1,"rates":[0.05,0.82,0.1,0.04],"why":{"0":"x 是「1 枝」原子筆的價錢，買了 5 枝要寫成 5x。","2":"只有原子筆有 5 枝，立可帶只有 1 個，不能把 5 也乘到 39 上。","3":"5 是枝數，不是錢，不能直接加進總價。"}},"S111-7-5":{"src":"111 年 5 月七年級篩選測驗第 5 題","img":"scr111_7_05.png","lc":"A-7-1","opts":["x + 3","10x + 3","x + 5 × 3","10x + 5 × 3"],"ans":3,"rates":[0.03,0.06,0.06,0.85],"why":{"0":"x 和 3 都是「枚數」，要乘上面額才是錢。","1":"3 枚 5 元硬幣是 5×3 元，不是 3 元。","2":"x 枚 10 元硬幣是 10x 元，不是 x 元。"}},"S110-7-3":{"src":"110 年 5 月七年級篩選測驗第 3 題","img":"scr110_7_03.png","lc":"A-7-2","opts":["1000 − 4x = 860","4 + x = 860","4x = 860","4 + x = 1000"],"ans":0,"rates":null,"why":{"1":"4 是杯數，要乘上每杯 x 元：4 杯是 4x 元。","2":"860 元是「找回」的錢，不是冰淇淋的錢。","3":"4 杯冰淇淋是 4x 元，不是 4＋x 元。"}},"S109-7-14":{"src":"109 年 5 月七年級篩選測驗第 14 題","img":"scr109_7_14.png","lc":"A-7-2","opts":["2x = 699","2x − x = 699","x + ½x = 699","x + 2x = 699"],"ans":3,"rates":null,"why":{"0":"2x 只是哥哥出的錢，還要加上弟弟的 x 元。","1":"合買是「相加」，不是相減。","2":"哥哥是弟弟的 2 倍，是 2x，不是 ½x。"}},"S113-7-11":{"src":"113 年 5 月七年級篩選測驗第 11 題","img":"scr113_7_11.png","lc":"A-7-1","opts":["−20x − 9","−40x + 9","−40x + 270","−40x − 270"],"ans":2,"rates":[0.08,0.11,0.55,0.25],"why":{"0":"−30 要乘到括號裡的每一項，再和 20x 合併。","1":"括號裡的 −9 也要乘 −30：(−30)×(−9)＝+270。","3":"(−30)×(−9)＝+270，負負得正，不是 −270。"}},"S114-7-6":{"src":"114 年 5 月七年級篩選測驗第 6 題","img":"scr114_7_06.png","lc":"A-7-1","opts":["7x + 8","3x + 5","3x − 4","3x − 7"],"ans":1,"rates":[0.09,0.54,0.19,0.18],"why":{"0":"括號前是 −2：−2(x − 3)＝−2x＋6，x 項要變成 −2x。","2":"−2 也要乘到 −3：(−2)×(−3)＝+6。","3":"(−2)×(−3)＝+6，負負得正，不是 −6。"}},"S114-7-10":{"src":"114 年 5 月七年級篩選測驗第 10 題","img":"scr114_7_10.png","lc":"A-7-3","opts":["½x + 1 = 15 + ½y","x + 2 = 25 + y","5x − 10 = 20 + y","50x + 100 = 300 + 10y"],"ans":3,"rates":[0.08,0.13,0.22,0.57],"why":{"0":"左邊是除以 10，右邊卻是除以 2，兩邊做的事不一樣。","1":"左邊是除以 5，右邊卻是減 5，兩邊做的事不一樣。","2":"左邊減了 20，右邊只減了 10，天平就不平衡了。"}},"S111-7-12":{"src":"111 年 5 月七年級篩選測驗第 12 題","img":"scr111_7_12.png","lc":"A-7-3","opts":["步驟一","步驟二","步驟三","步驟四"],"ans":1,"rates":[0.09,0.65,0.16,0.1],"why":{"0":"2(x − 5)＝2x − 10，去括號是對的。","2":"步驟三的運算本身沒錯，但它接在錯誤的步驟二後面。錯誤從哪一步「開始」？","3":"步驟四只是照著前面的結果除以 5，錯誤更早就出現了。"}},"S112-7-8":{"src":"112 年 5 月七年級篩選測驗第 8 題","img":"scr112_7_08.png","lc":"A-7-2","opts":["x + 2 = 1","2x + 1 = 0","3x + 3 = 9","x/3 − 2 = −1"],"ans":3,"rates":[0.08,0.06,0.12,0.73],"why":{"0":"代入 x＝3：3＋2＝5，不等於 1。","1":"代入 x＝3：2×3＋1＝7，不等於 0。","2":"代入 x＝3：3×3＋3＝12，不等於 9。要真的代進去算。"}},"S114-7-15":{"src":"114 年 5 月七年級篩選測驗第 15 題","img":"scr114_7_15.png","lc":"A-7-2","opts":["x = 0","x = −1","x = −3","x = −5"],"ans":1,"rates":[0.11,0.58,0.19,0.12],"why":{"0":"x＝0 時 ax＋b＝6，不是 4。","2":"x＝−3 讓 ax＋b＝0，但題目要的是 ax＋b＝4。解不一定是讓式子等於 0 的數。","3":"x＝−5 時 ax＋b＝−4，注意正負號。"}},"S111-7-6":{"src":"111 年 5 月七年級篩選測驗第 6 題","img":"scr111_7_06.png","lc":"A-7-2","opts":["1","0","−1","−3"],"ans":0,"rates":[0.78,0.07,0.09,0.06],"why":{"1":"把 x＝1 代入 2x − 1：2×1 − 1＝1。","2":"2×1 − 1＝1，不是 −1，注意運算順序與正負號。","3":"解是 x＝1，把 1 代進 x 的位置再計算。"}},"S112-7-1":{"src":"112 年 5 月七年級篩選測驗第 1 題","img":"scr112_7_01.png","lc":"A-7-3","opts":["1","2","5","6"],"ans":1,"rates":[0.08,0.7,0.11,0.1],"why":{"0":"把 1 代回：3(2×1 − 1)＝3，不等於 9。","2":"看起來像把 2x − 1＝9 來解，忘了括號外還乘 3。先兩邊同除以 3：2x − 1＝3。","3":"把 6 代回：3(2×6 − 1)＝33，不等於 9。"}},"S113-7-19":{"src":"113 年 5 月七年級篩選測驗第 19 題","img":"scr113_7_19.png","lc":"A-7-3","opts":["12","15","16","18"],"ans":1,"rates":[0.16,0.53,0.17,0.15],"why":{"0":"⅔(x − 6)＝6 之後，兩邊要同乘 3/2，得 x − 6＝9。","2":"把 16 代回：1＋⅔×10 不等於 7。","3":"把 1 移到右邊要變成 −1：⅔(x − 6)＝7 − 1＝6，不是 8。"}},"S110-7-13":{"src":"110 年 5 月七年級篩選測驗第 13 題","img":"scr110_7_13.png","lc":"A-7-3","opts":["−1","9/5","11/5","4"],"ans":2,"rates":null,"why":{"0":"把 −1 代回：½(−5 − 8) 不等於 3/2。","1":"兩邊同乘 2 得 5x − 8＝3，再兩邊同加 8：5x＝11。","3":"把 4 代回：½(20 − 8)＝6，不等於 3/2。"}},"C111-11":{"src":"111 年國中教育會考第 11 題","img":"cap111_11.png","lc":"A-7-3","opts":["3800","4800","5800","6800"],"ans":2,"rates":[0.1113,0.122,0.7037,0.0607],"why":{"0":"代回檢查：預算 3800，售價 5000，打 8 折是 4000，比預算「多」200，方向相反了。","1":"代回檢查：預算 4800，售價 6000，打 8 折剛好 4800。漏掉了「比預算還要少 200 元」這個條件。","3":"代回檢查：預算 6800，售價 8000，打 8 折是 6400，比預算少 400，不是 200。"}},"C114-14":{"src":"114 年國中教育會考第 14 題","img":"cap114_14.png","lc":"A-7-3","opts":["4300 ~ 4399 元","4400 ~ 4499 元","4500 ~ 4599 元","4600 ~ 4699 元"],"ans":2,"rates":[0.1153,0.1602,0.5577,0.1633],"why":{"0":"設賣出 x 組早餐組合，單買的咖啡是 120 − x 杯、三明治是 100 − x 個，列出總收入＝8700 再解。","1":"設賣出 x 組早餐組合，單買的咖啡是 120 − x 杯、三明治是 100 − x 個，列出總收入＝8700 再解。","3":"設賣出 x 組早餐組合，單買的咖啡是 120 − x 杯、三明治是 100 − x 個，列出總收入＝8700 再解。"},"sol":"70x＋50(120−x)＋40(100−x)＝8700，10000−20x＝8700，x＝65，早餐組合收入 70×65＝4550 元。"},"C115-10":{"src":"115 年國中教育會考第 10 題","img":"cap115_10.png","lc":"N-7-9","opts":["360","380","460","480"],"ans":3,"rates":[0.0672,0.1792,0.1098,0.6413],"why":{"0":"代回檢查：兩人原價 1080 元，沒有滿 1100 元，不能折扣。","1":"1100 − 720＝380 是把「滿 1100 元」當成「剛好 1100 元」。題目沒有說合計剛好 1100。","2":"代回檢查：兩人原價 1180，折扣後 980，哥哥依原價比分攤 720/1180×980 不等於 600。"},"sol":"哥哥原價 720 付 600，付了 5/6；依原價比分攤，總金額也是總原價的 5/6。總原價 T：T−200＝(5/6)T，T＝1200，妹妹 1200−720＝480。"}}, ISL=[{"id":1,"name":"符號島","sub":"列式工坊","myth":"M4 列式時數量關係對錯物件","lc":"A-7-1、A-7-2","gen":"expr","real":["S113-7-7","S111-7-5","S110-7-3","S109-7-14"],"lesson":["x 代表一個「數」，可以和其他數一起運算。","「每個 x 元，買 5 個」是 5×x，記成 5x；只有被乘的那一種東西要乘。","列式前先分清楚：哪些是已知量、哪個是未知量、它們之間的關係是什麼。"],"fb":"回饋訊息 109.05、111.05 第 5 題：由「3 個十元是 10×3 元」推到「y 個十元是 10y 元」。"},{"id":2,"name":"括號島","sub":"分配律砲台","myth":"M1 分配律只乘第一項，括號前的負號不變號","lc":"A-7-1","gen":"dist","real":["S113-7-11","S114-7-6"],"lesson":["括號前的數要乘到括號裡的「每一項」。","括號前是負數時，每一項都要變號：−2(x − 3)＝−2x＋6。","不放心時，把減號都改成「加上負數」再乘：−2×[x＋(−3)]。"],"fb":"回饋訊息 113.05 第 11 題、114.05 第 6 題：先複習整數的加減乘除，再複習乘法對加法、減法的分配律。"},{"id":3,"name":"天平島","sub":"等量公理天平","myth":"M2 等量公理只做一邊","lc":"A-7-3","gen":"balance","real":["S114-7-10","S111-7-12"],"lesson":["等號就像天平，兩邊要「同時」做同一件事，天平才會保持平衡。","先把 x 集中到一邊，再把數字集中到另一邊，最後兩邊同除以 x 的係數。","移項其實是等量公理的簡寫：兩邊同減 5，看起來就像把 +5 移到另一邊變成 −5。"],"fb":"回饋訊息 111.05 第 12 題、114.05 第 10 題：用天平與沙包、砝碼操作，再由等量公理   const kk=`${minus?'−':''}${k}`;
  // 三種常見錯誤：只乘第一項、常數項沒變號、x 項沒變號
  const wrong=[[X,-d,`${kk} 要乘到括號裡的每一項，−${d} 也要乘 ${kk}。`],
    [X,-C,minus?`(−${k})×(−${d})＝+${k*d}，負負得正。`:`${k}×(−${d})＝−${k*d}，正乘負得負。`],
    [a-s*k*c,C,`${kk}×${c}x＝${M(s*k*c)}x，${minus?'括號前是負號，x 項也要變號。':'x 項不用變號。'}`]];
  const seen=new Set([right]);const opts=[right];const w={};
  wrong.forEach(([p,r,t])=>{const e=lin(p,r);if(!seen.has(e)){seen.add(e);w[opts.length]=t;opts.push(e)}});
  while(opts.length<4){const t=lin(X+rnd(1,3),C);if(!seen.has(t)){seen.add(t);w[opts.length]='把每一項乘開後，再合併同類項。';opts.push(t)}}
  return mc(q,opts,0,w,`${minus?'−':''}${k}(${c}x − ${d})＝${lin(s*k*c,C)}，再和 ${term(a,'x',true)} 合併：${right}`)
}
function genCheck(){
  const x0=rnd(-5,8);const t=rnd(0,2);let e,f;
  if(t===0){const a=rnd(2,6)*pick([1,-1]),b=rnd(-9,9);e=`${lin(a,b)} = ${M(a*x0+b)}`;f=x=>[a*x+b,a*x0+b]}
  else if(t===1){const a=rnd(2,5),b=pick([-5,-4,-3,-2,-1,1,2,3,4,5]);e=`${a}(x ${b<0?'−':'+'} ${Math.abs(b)}) = ${M(a*(x0+b))}`;f=x=>[a*(x+b),a*(x0+b)]}
  else{const a=rnd(3,6),b=rnd(1,9),c=rnd(1,a-1),d=a*x0+b-c*x0;e=`${lin(a,b)} = ${lin(c,d)}`;f=x=>[a*x+b,c*x+d]}
  const cands=new Set([x0]);while(cands.size<4)cands.add(x0+pick([-3,-2,-1,1,2,3,-x0*2||4]));
  const opts=shuffle([...cands]);const ans=opts.indexOf(x0);
  const why={};opts.forEach((v,i)=>{if(i!==ans){const [L,R]=f(v);why[i]=`代入 x＝${M(v)}：左邊＝${M(L)}，右邊＝${M(R)}，兩邊不相等。`}});
  const [L,R]=f(x0);
  return {...mc(`下列哪一個是方程式 <span class="eq">${e}</span> 的解？`,opts.map(v=>`x = ${M(v)}`),ans,why,`代入 x＝${M(x0)}：左邊＝${M(L)}，右邊＝${M(R)}，兩邊相等，所以 x＝${M(x0)} 是解。`),noShuffle:true}
}
function genSolve(){
  const x0=rnd(-6,9);const t=rnd(0,3);let q,steps;const nz=(a,b)=>{let v=0;while(!v)v=rnd(a,b);return v};const rnd0=rnd;{const rnd=(a,b)=>a<0?nz(a,b):rnd0(a,b);
  if(t===0){const a=rnd(2,7)*pick([1,-1]),b=rnd(-12,12),c=a*x0+b;q=`${lin(a,b)} = ${M(c)}`;steps=[`兩邊同${b>=0?'減':'加'} ${Math.abs(b)}：${M(a)}x＝${M(c-b)}`,`兩邊同除以 ${M(a)}：x＝${M(x0)}`]}
  else if(t===1){const a=rnd(2,5),b=rnd(-6,6)||2,c=a*(x0+b);q=`${a}(x ${b<0?'−':'+'} ${Math.abs(b)}) = ${M(c)}`;steps=[`兩邊同除以 ${a}：x ${b<0?'−':'+'} ${Math.abs(b)}＝${M(x0+b)}`,`兩邊同${b>=0?'減':'加'} ${Math.abs(b)}：x＝${M(x0)}`]}
  else if(t===2){const a=rnd(3,8),c=rnd(1,a-1),b=rnd(-10,10),d=a*x0+b-c*x0;q=`${lin(a,b)} = ${lin(c,d)}`;steps=[`兩邊同減 ${c}x：${lin(a-c,b)}＝${M(d)}`,`兩邊同${b>=0?'減':'加'} ${Math.abs(b)}：${M(a-c)}x＝${M(d-b)}`,`兩邊同除以 ${a-c}：x＝${M(x0)}`]}
  else{const p=pick([2,3,4]),r=rnd(1,p-1),b=rnd(-6,6);const xx=x0*p - b;/* (r/p)(x+b)=r*x0 */q=`${r}/${p} × (x ${b<0?'−':'+'} ${Math.abs(b)}) = ${M(r*x0)}`;const X=p*x0-b;steps=[`兩邊同乘 ${p}/${r}：x ${b<0?'−':'+'} ${Math.abs(b)}＝${M(p*x0)}`,`兩邊同${b>=0?'減':'加'} ${Math.abs(b)}：x＝${M(X)}`];return {kind:'num',q:`解方程式 <span class="eq">${q}</span>，x＝？`,ans:X,explain:steps}}
  return {kind:'num',q:`解方程式 <span class="eq">${q}</span>，x＝？`,ans:x0,explain:steps}}
}
function genBalance(){const x0=rnd(1,6),a=rnd(2,4),c=rnd(0,a-1),b=rnd(1,8),d=a*x0+b-c*x0;return {kind:'balance',a,b,c,d,x0}}
function mc(q,opts,ans,why,explain){const order=shuffle(opts.map((_,i)=>i));return {kind:'mc',q,opts:order.map(i=>opts[i]),ans:order.indexOf(ans),why:Object.fromEntries(Object.entries(why||{}).map(([k,v])=>[order.indexOf(+k),v])),explain}}
function realQ(id){const r=REAL[id];return {kind:'mc',real:id,q:'',img:r.img,opts:r.opts,ans:r.ans,why:Object.fromEntries(Object.entries(r.why).map(([k,v])=>[+k,v])),rates:r.rates,src:r.src,explain:r.sol||''}}

  function pan(sd,cx){const xs=Math.max(0,sd[0]),ns=Math.max(0,sd[1]);const neg=sd[0]<0||sd[1]<0;let g='';

       <rect x="60" y="0" width="180" height="10" rx="5" fill="var(--ink2)"/><rect x="360" y="0" width="180" height="10" rx="5" fill="var(--ink2)"/>
       <g>${pan(st.L,150)}</g><g>${pan(st.Rr,450)}</g></g></g>`;
    $('#beq').textContent=`${show(st.L)} = ${show(st.Rr)}`;
    $('#log').innerHTML=steps.map(s=>`<li>${esc(s)}</li>`).join('')}
  app.innerHTML=`<section class="stage">${stageHead(phase)}
   <div class="q">用等量公理讓天平的一邊只剩下一個 x。每一步都要「兩邊同時」做同一件事。</div>
   <div class="bal"><svg id="balsvg" viewBox="0 0 600 250" role="img" aria-label="天平"></svg><div class="baleq" id="beq"></div></div>
   <div class="ops"><label for="op" class="src">兩邊同時</label><select id="op"><option value="sub">減</option><option value="add">加</option><option value="div">除以</option></select>
    <input id="val" type="number" step="1" value="1" aria-label="數值"><select id="typ" aria-label="減加的是數還是 x"><option value="n">（數）</option><option value="x">個 x</option></select>
    <button class="btn pri" id="both">兩邊同時做</button><button class="btn" id="one">只做左邊</button><button class="btn" id="undo">復原</button></div>
   <div class="warn" id="warn"></div><ol class="log" id="log"></ol><div id="fbx"></div></section>`;
  const hist=[];draw();
  function apply(sd,op,v,t){if(op==='div')return [sd[0]/v,sd[1]/v];const k=op==='sub'?-v:v;return t==='x'?[sd[0]+k,sd[1]]:[sd[0],sd[1]+k]}
  $('#typ').parentElement;$('#op').onchange=()=>{$('#typ').disabled=$('#op').value==='div'};
  $('#both').onclick=()=>{const op=$('#op').value,v=+$('#val').value,t=$('#typ').value;$('#warn').textContent='';tilt=0;
    if(!Number.isInteger(v)||v===0){$('#warn').textContent='請填一個不是 0 的整數。';return}
    if(op==='div'&&[...st.L,...st.Rr].some(n=>n%v!==0)){$('#warn').textContent='除完會出現分數，先換一個步驟試試。';return}
    hist.push(JSON.stringify(st));st={L:apply(st.L,op,v,t),Rr:apply(st.Rr,op,v,t)};
    steps.push(`兩邊同${op==='sub'?'減':op==='add'?'加':'除以'} ${v}${op!=='div'&&t==='x'?'x':''}：${show(st.L)} = ${show(st.Rr)}`);draw();
    if(goal()){const xv=st.L[0]===1?st.Rr[1]:st.L[1];const ok=steps.length<=4;
      logAns({qid:'gen-balance',q:`天平：${lin(q.a,q.b)} = ${lin(q.c,q.d)}`,ans:`x＝${M(xv)}（${steps.length} 步${oneSide?`，曾按「只做左邊」${oneSide} 次`:''}）`,correct:`x＝${M(q.x0)}`,ok:true,hint:oneSide?'曾只對一邊做運算':''});
      record(true,ok?150:100);
      const fb=$('#fbx');fb.innerHTML=`<div class="fb pop"><b>天平平衡，x＝${M(xv)}！</b> 用了 ${steps.length} 步${ok?'，賞金 +150':'，賞金 +100（試試看能不能更少步）'}。<p>檢查：把 x＝${M(xv)} 代回原式 ${lin(q.a,q.b)} = ${lin(q.c,q.d)}，左邊＝${M(q.a*xv+q.b)}，右邊＝${M(q.c*xv+q.d)}。</p></div>`;
      ['both','one','undo'].forEach(i=>$('#'+i).disabled=true);afterAnswer(fb.firstElementChild)}};
  $('#one').onclick=()=>{const op=$('#op').value;tilt=op==='add'?-1:1;oneSide++;draw();$('#warn').textContent='天平傾斜了！只做一邊，等號就不成立了。等號兩邊要做同一件事。';setTimeout(()=>{tilt=0;draw()},1400)};
  $('#undo').onclick=()=>{if(!hist.length)return;st=JSON.parse(hist.pop());steps.pop();tilt=0;draw();$('#warn').textContent=''};
}

/* ---------- BUCK ---------- */
function showBuck(q,phase){const b=BUCKQ[q.id],real=REAL[q.id];let mode='b';const marks={};
  const segs=[];const html=b.text.replace(/\{([buck]):([^}]*)\}/g,(m,t,x)=>{segs.push(t);return `<span class="seg" data-s="${segs.length-1}" tabindex="0" role="button">${x}</span>`});
  app.innerHTML=`<section class="stage">${stageHead(phase)}<p class="src">${esc(real.src)}</p>
   <div class="q">先用 BUCK 拆題：選一種筆，再點題目中淡黃色的句子做記號。</div>
   <div class="bkmodes" role="group" aria-label="選擇記號">${[['b','B 框出問題'],['u','U 劃出條件'],['c','C 圈出關鍵字'],['k','K 刪掉不需要的']].map(m=>`<button data-m="${m[0]}" aria-pressed="${m[0]==='b'}">${m[1]}</button>`).join('')}</div>
   <div class="bktext" id="bkt">${html.replace(/<br>/g,'<br>')}</div>
   <p><button class="btn pri" id="bkchk">檢查我的記號</button></p><div id="bkres"></div>
   ${real.img&&IMG[real.img]?`<details><summary>看原題圖片</summary><div class="qimg"><img alt="原題" src="data:image/png;base64,${IMG[real.img]}"></div></details>`:''}</section>`;
  app.querySelectorAll('.bkmodes button').forEach(x=>x.onclick=()=>{mode=x.dataset.m;app.querySelectorAll('.bkmodes button').forEach(y=>y.setAttribute('aria-pressed',y===x))});
  app.querySelectorAll('.seg').forEach(s=>{const f=()=>{const i=+s.dataset.s;marks[i]=marks[i]===mode?undefined:mode;s.className='seg'+(marks[i]?' '+marks[i]:'')};s.onclick=f;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
  $('#bkchk').onclick=()=>{let ok=0;app.querySelectorAll('.seg').forEach(s=>{const i=+s.dataset.s;const good=marks[i]===segs[i];if(good)ok++;s.className='seg '+segs[i]+(good?'':' wrong')});
    $('#bkchk').disabled=true;
    const missed=[...new Set(segs.filter((t,i)=>marks[i]!==t))].map(t=>({b:'B 問題',u:'U 條件',c:'C 關鍵字',k:'K 刪除'}[t]));
    logAns({phase:'BUCK 標記',qid:q.id+'-BUCK',q:real.src+'（BUCK 標記）',ans:`標對 ${ok}／${segs.length}`,correct:`${segs.length}／${segs.length}`,ok:ok===segs.length,hint:missed.length?'沒標好：'+missed.join('、'):''});
    $('#bkres').innerHTML=`<div class="fb pop"><b>你標對了 ${ok}／${segs.length} 個記號。</b> 紅框外有粗框的是你和參考答案不同的地方，現在顯示的是參考記號。<p>先猜猜看：${esc(b.guess)}</p><p><button class="btn pri" id="bkgo">用記號來解題</button></p></div>`;
    $('#bkgo').onclick=()=>{const rq=realQ(q.id);rq.q=`<div class="bktext" style="font-size:16px">${$('#bkt').innerHTML}</div>`;rq.img=null;rq.buckBonus=ok;showMC(rq,phase)}};
}

/* ---------- 結算與懸賞令 ---------- */
function finish(){const d=R.d;
  if(d.id===0){S.bounty+=R.gain;save();const n=R.res.filter(Boolean).length;
    app.innerHTML=`<section class="stage pop">${stageHead('訂正結算')}<h2>訂正了 ${n}／${R.qs.length} 題</h2><p>賞金 +${R.gain}。${n<R.qs.length?'還沒訂正的題目會留在錯題本，下次再挑戰。':'全部訂正完成！'}</p>
     <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="lg">回我的航海日誌</button><button class="btn" id="hm4">回海圖</button></p></section>`;
    $('#lg').onclick=viewLog;$('#hm4').onclick=viewMap;return}
  const passReal=d.gen==='boss'?R.res.filter(Boolean).length>=7:true;
  const ok=R.hearts>0&&passReal;let stars=0;
  if(ok){stars=R.miss===0?3:R.miss===1?2:1;const prev=S.isl[d.id]?.stars||0;if(stars>prev)S.isl[d.id]={stars};S.bounty+=R.gain+(d.gen==='boss'?3000:500);save()}
  app.innerHTML=`<section class="stage pop">${stageHead('航海結算')}
   ${ok?`<h2 style="color:var(--good)">${d.name}通關！</h2><p class="stars" style="font-size:34px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
    <p>本次賞金 <b>${(R.gain+(d.gen==='boss'?3000:500)).toLocaleString()}</b> 貝里（含通關獎勵 ${d.gen==='boss'?3000:500}）。答錯 ${R.miss} 題。</p>`
    :`<h2 style="color:var(--bad)">這次沒有通關</h2><p>${d.gen==='boss'?`魔王島要答對 7 題以上，你答對 ${R.res.filter(Boolean).length} 題。`:''}回到小教室複習一下，再出航吧！</p>`}
   <p class="src">這座島對應的迷思：${esc(d.myth)}</p>
   <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="again">${ok?'再玩一次（題目會換）':'重新挑戰'}</button>${ok&&d.id<7?`<button class="btn" id="nexti">前往 ${ISL[d.id].name}</button>`:''}<button class="btn" id="home3">回海圖</button>${ok?'<button class="btn" id="pst">看我的懸賞令</button>':''}</p></section>`;
  $('#again').onclick=()=>openIsland(d.id);$('#home3').onclick=viewMap;if($('#nexti'))$('#nexti').onclick=()=>openIsland(d.id+1);if($('#pst'))$('#pst').onclick=viewPoster;
}
function viewPoster(){const badges=ISL.filter(d=>cleared(d.id)).map(d=>`<span>${d.name}${'★'.repeat(S.isl[d.id].stars)}</span>`).join('');
  app.innerHTML=`<div class="poster pop"><div class="w">WANTED</div><div class="face">${esc((S.name||'?').slice(0,1))}</div><div class="nm">${esc(S.name||'無名船長')}</div><div>DEAD OR ALIVE</div>
   <div class="bounty">฿ ${S.bounty.toLocaleString()} –</div><div style="margin-top:6px">一元一次方程式的偉大航道 通關 ${[1,2,3,4,5,6,7].filter(cleared).length}／7 島</div><div class="badges">${badges}</div></div>
   <p style="text-align:center"><button class="btn" id="hm">回海圖</button></p><p class="src" style="text-align:center">可以截圖交給老師，當作闖關紀錄。</p>`;
  $('#hm').onclick=viewMap}

/* ---------- 我的航海日誌（學生回顧） ---------- */
function viewLog(){const me=sid();const H=S.hist.filter(r=>(r.ok===true||r.ok===false)&&r.sid===me);
  const tot=H.length,ok=H.filter(r=>r.ok).length;
  const byI=ISL.map(d=>{const a=H.filter(r=>r.isl===d.id);return {d,n:a.length,ok:a.filter(r=>r.ok).length}});
  const wrong=H.filter(r=>!r.ok).slice().reverse();
  const realWrong=[...new Set(wrong.filter(r=>REAL[r.qid]).map(r=>r.qid))];
  const lastOk=id=>{const a=H.filter(r=>r.qid===id);return a.length&&a[a.length-1].ok};
  const pending=realWrong.filter(id=>!lastOk(id));
  const weak=byI.filter(x=>x.n>=3&&x.ok/x.n<.7).sort((a,b)=>a.ok/a.n-b.ok/b.n);
  app.innerHTML=`<section class="stage pop"><div class="stagehd"><div><div class="phase">MY LOGBOOK</div><h2>我的航海日誌</h2></div><span class="chip">${sid()?`${esc(S.cls)} 班 ${esc(S.seat)} 號 ${esc(S.name)}`:'尚未登船'}</span></div>
   ${tot?`<p>一共作答 <b>${tot}</b> 題，答對 <b>${ok}</b> 題（${Math.round(ok/tot*100)}%）。${S.outbox.length?`還有 ${S.outbox.length} 筆紀錄等網路連上後上傳。`:''}</p>
   <h3 style="margin-top:12px">各島答對率</h3><div class="rates" style="max-width:560px">${byI.map(x=>`<div class="rate" style="grid-template-columns:96px 1fr 70px"><span>${x.d.name}</span><span class="t"><i style="width:${x.n?x.ok/x.n*100:0}%;background:${!x.n?'transparent':x.ok/x.n>=.8?'var(--good)':x.ok/x.n>=.6?'var(--gold)':'var(--bad)'}"></i></span><span>${x.n?`${x.ok}/${x.n}`:'—'}</span></div>`).join('')}</div>
   ${weak.length?`<div class="fb no" style="margin-top:12px"><b>建議再練習：</b>${weak.map(x=>`<button class="btn sm" data-go="${x.d.id}">${x.d.name}（${esc(x.d.myth)}）</button>`).join(' ')}</div>`:''}
   <h3 style="margin-top:16px">錯題本（${wrong.length} 題）</h3>
   ${pending.length?`<p><button class="btn pri" id="redo">錯題再挑戰（${pending.length} 題真題）</button> <span class="src">還沒訂正成功的真題會再出一次。</span></p>`:wrong.length?'<p class="src">真題錯題都已經訂正了！練習題答錯的，可以回到該島再玩一次。</p>':''}
   <div style="display:grid;gap:10px;margin-top:8px">${wrong.slice(0,60).map(r=>`<div class="fb no" style="margin:0"><div class="src">${new Date(r.t).toLocaleString('zh-TW',{hour12:false})}｜${esc(r.islName)}｜${esc(r.phase)}</div>
     <div><b>${esc(r.q)}</b></div><div>我的答案：${esc(r.ans)}　正確答案：${esc(r.correct)}</div>${r.hint?`<div>提示：${esc(r.hint)}</div>`:''}${REAL[r.qid]?(lastOk(r.qid)?'<div style="color:var(--good)">✔ 已訂正</div>':''):''}</div>`).join('')||'<p>目前沒有錯題，太厲害了！</p>'}</div>`
   :'<p>還沒有作答紀錄。回到海圖出航吧！</p>'}
   <p style="margin-top:14px"><button class="btn" id="hm">回海圖</button></p></section>`;
  $('#hm').onclick=viewMap;app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openIsland(+b.dataset.go));
  if($('#redo'))$('#redo').onclick=()=>openReview(pending.slice(0,10));
}
function openReview(ids){R={d:{id:0,name:'錯題島',sub:'訂正挑戰',myth:'錯題再挑戰',lesson:['先讀一次上次的提示，再作答。','答對就算訂正成功，答錯會再顯示全國作答比例與提示。'],fb:'',gen:'review'},
  qs:shuffle(ids).map(realQ),i:0,hearts:3,miss:0,res:[],nPractice:0,gain:0,round:Date.now().toString(36)};viewLesson()}

$('#goLog').onclick=viewLog;$('#goHome').onclick=viewMap;hud();viewMap();flush();
</script>

</html>
